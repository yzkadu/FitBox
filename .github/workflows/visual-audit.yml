name: Audit all FitBox exercise images
on:
  pull_request:
    paths:
      - 'scripts/audit-exercise-visuals.py'
      - 'scripts/normalize-exercise-art.py'
      - 'public/exercise-guide/**'
      - 'src/assets/exercise-guide/**'
      - 'src/lib/*IllustrationMedia.ts'
      - '.github/workflows/visual-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image audit dependency
        run: python -m pip install Pillow==11.3.0
      - name: Check every atlas cell, content and possible duplicates
        run: python scripts/audit-exercise-visuals.py --previews

  normalize:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/visual-catalog-full-20261113'
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image processing dependency
        run: python -m pip install Pillow==11.3.0
      - name: Produce clean, framed individual WebP for every atlas ID
        run: python scripts/normalize-exercise-art.py
      - name: Commit generated artworks into this trusted audit branch
        run: |
          git add public/exercise-guide/clean/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "assets: add clean per-exercise WebP for all 319 atlas IDs"
            git push origin HEAD:refs/heads/${{ github.head_ref }}
          fi
